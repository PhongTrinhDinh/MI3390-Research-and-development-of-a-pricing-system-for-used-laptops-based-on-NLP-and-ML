name: Weekly Laptop Crawler & Medallion ETL to S3

on:
  schedule:
    - cron: '0 0 * * 1'  # 00:00 Thứ 2 hàng tuần (UTC)
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java for PySpark
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r crawler/requirements-crawler.txt
          pip install pyspark==4.2.1 python-dotenv numpy pandas pyarrow

      - name: Run Scrapy Crawler
        working-directory: ./crawler
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DATABASE: ${{ secrets.MONGO_DATABASE || 'scrapy_db' }}
        run: |
          export PYTHONPATH=.
          scrapy crawl chotot_laptop -s SETTINGS_MODULE=settings -s CLOSESPIDER_ITEMCOUNT=2000

      - name: Run PySpark Medallion ETL (Bronze -> Silver -> Gold)
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB: ${{ secrets.MONGO_DATABASE || 'scrapy_db' }}
          MONGO_COLL_RAW: "Laptop_Crawler"
        run: |
          export PYTHONPATH=.
          python -m src.data_pipeline.main_etl

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}

      - name: Sync Parquet Layers & Models to AWS S3 Data Lake
        env:
          BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET || 'chotot-laptop-datalake-2026-155079499635-ap-southeast-2-an' }}
        run: |
          DATE_TAG=$(date +'%Y-%m-%d')
          echo "Bắt đầu đồng bộ Data Lake lên S3: s3://${BUCKET_NAME} ..."

          echo "1. Đồng bộ Bronze Layer..."
          if [ -d "data/raw/bronze_layer" ]; then
            aws s3 sync data/raw/bronze_layer/ s3://${BUCKET_NAME}/bronze/date=${DATE_TAG}/
          fi

          echo "2. Đồng bộ Silver Layer..."
          if [ -d "data/processed/silver_layer" ]; then
            aws s3 sync data/processed/silver_layer/ s3://${BUCKET_NAME}/silver/date=${DATE_TAG}/
          fi

          echo "3. Đồng bộ Gold Layer (Features & PipelineModel)..."
          if [ -d "data/features/gold_layer" ]; then
            aws s3 sync data/features/gold_layer/ s3://${BUCKET_NAME}/gold/date=${DATE_TAG}/
            aws s3 sync data/features/gold_layer/ s3://${BUCKET_NAME}/gold/latest/ --delete
          fi

          if [ -d "models/transformers" ]; then
            aws s3 sync models/transformers/ s3://${BUCKET_NAME}/models/transformers/latest/ --delete
          fi

          echo "Đồng bộ AWS S3 Data Lake hoàn tất!"
